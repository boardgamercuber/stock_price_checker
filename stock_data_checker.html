<!-- functions.py 내용 (build_html.py 가 자동으로 채움) -->
<script type="text/plain" id="functions-py">
"""
Stock Data Checker - 기능 함수 모음

이 파일은 브라우저(Pyodide) 안에서 실행된다. 서버 없이 동작하기 위해
stock_data_checker.html 안에 내용이 그대로 포함되며, build_html.py 로 갱신한다.
"""
import json
import re
import time
from datetime import date, timedelta

import numpy as np
import pandas as pd

# 종목 선택 Drop Down 기본 목록 (코드, 표시 이름)
DEFAULT_STOCKS = [
    ("005930", "삼성전자"),
    ("000660", "SK하이닉스"),
    ("BITX", "비트코인 레버리지 2X ETF"),
    ("498400", "KODEX 200 타겟 위클리 커버드콜"),
    ("441640", "KODEX 미국배당 커버드콜 액티브"),
    ("237350", "KODEX 코스피 100"),
    ("114800", "KODEX 인버스"),
]

# 브라우저에서는 Naver / Yahoo 가 CORS 헤더를 주지 않으므로 CORS proxy 를 경유한다.
# "{url}" 은 원본 URL, "{url_enc}" 는 URL 인코딩된 원본 URL.
# 1) 전용 Cloudflare Worker (cloudflare_worker/worker.js): 매 시도마다 가장 먼저 사용.
#    https://boardgamercuber.github.io/stock_price_checker/ 에서 열었을 때만 허용된다.
CLOUDFLARE_WORKER_URL = "https://stock-data-proxy.stock-check.workers.dev"
PRIMARY_PROXIES = [CLOUDFLARE_WORKER_URL + "/?url={url_enc}"]

# 2) 예비 공개 CORS proxy: Worker 가 실패하거나 허용되지 않는 곳(예: PC 에서 파일로 열기)에서 사용.
#    불안정하므로 시도마다 시작 proxy 를 바꾼다.
CORS_PROXIES = [
    "https://cors.eu.org/{url}",
    "https://api.allorigins.win/raw?url={url_enc}",
    "https://api.codetabs.com/v1/proxy?quest={url_enc}",
]

# Data 요청 설정: 1회 시도 제한 시간(초) / 최대 시도 횟수
FETCH_TIMEOUT_SEC = 30
FETCH_ATTEMPTS = 3

# Data 요청 중 공유하는 상태 (Naver 요청 일수, 진행 상황 표시 callback)
_fetch_state = {"naver_count": None, "on_status": None}


class FetchTimeoutError(Exception):
    """제한 시간 안에 Data 를 가져오지 못함."""


class FetchError(Exception):
    """Data 서버 / proxy 오류로 Data 를 가져오지 못함."""


def get_default_period(today=None, years=1):
    """기본 조회 기간 (시작일, 종료일)을 'YYYY-MM-DD' 문자열로 반환한다. 종료일은 오늘."""
    today = today or date.today()
    try:
        start = today.replace(year=today.year - years)
    except ValueError:  # 2월 29일
        start = today - timedelta(days=365 * years)
    return start.isoformat(), today.isoformat()


def get_stock_options():
    """Drop Down 에 넣을 (value, label) 목록을 반환한다."""
    return [(code, f"{code} ({name})") for code, name in DEFAULT_STOCKS]


def set_status_callback(callback):
    """Data 요청 진행 상황(문자열)을 받을 함수를 등록한다. (Web Page 의 Status 표시용)"""
    _fetch_state["on_status"] = callback


def report_status(msg):
    if _fetch_state["on_status"]:
        _fetch_state["on_status"](msg)


def get_naver_count(fetch_start, today=None):
    """fetch_start 부터 오늘까지 필요한 거래일 수(여유 포함)를 추정한다."""
    today = pd.Timestamp(today or date.today())
    days = (today - pd.Timestamp(fetch_start)).days
    return max(int(days * 5 / 7) + 20, 30)


def limit_naver_count(url, count):
    """
    finance-datareader 는 Naver 에 항상 6000 거래일치(삼성전자 약 200KB)를 요청한다.
    느린 CORS proxy 를 거치면 오래 걸리므로 필요한 거래일 수로 줄인다.
    """
    if count and "fchart.stock.naver.com" in url:
        return re.sub(r"count=\d+", f"count={int(count)}", url)
    return url


def http_get_sync(url, timeout):
    """
    브라우저 Web Worker 안에서 동기 XMLHttpRequest 로 GET 요청 후 requests.Response 로 반환한다.
    (제한 시간은 Web Worker 에서만 설정할 수 있다.) timeout(초) 초과 시 FetchTimeoutError.
    """
    import js
    import requests
    from pyodide.ffi import JsException

    xhr = js.XMLHttpRequest.new()
    xhr.open("GET", url, False)
    xhr.responseType = "arraybuffer"
    xhr.timeout = max(int(timeout * 1000), 1)
    started = time.monotonic()
    try:
        xhr.send()
    except JsException as e:
        if "timeout" in str(e).lower() or time.monotonic() - started >= timeout - 0.05:
            raise FetchTimeoutError(f"{timeout:.1f}초 초과") from None
        raise ConnectionError(str(e).splitlines()[0]) from None

    resp = requests.Response()
    resp.status_code = int(xhr.status)
    resp.url = url
    resp._content = js.Uint8Array.new(xhr.response).to_bytes() if xhr.response else b""
    content_type = xhr.getResponseHeader("Content-Type") or ""
    resp.headers["Content-Type"] = content_type
    charset = re.search(r"charset=([\w-]+)", content_type)
    resp.encoding = charset.group(1) if charset else None
    return resp


def install_browser_requests(proxies=None, timeout=FETCH_TIMEOUT_SEC, attempts=FETCH_ATTEMPTS, http_get=None,
                             primary=None):
    """
    finance-datareader 가 사용하는 requests.get 을 브라우저용으로 바꾼다.
    - Naver / Yahoo 는 CORS 헤더가 없으므로 CORS proxy 를 경유
      (primary(기본: Cloudflare Worker)를 먼저, 실패하면 예비 공개 proxy 사용)
    - 1회 시도는 timeout(기본 30초) 안에 끝나야 하며, 넘으면 다음 시도(Retry)
      (시도 안에서는 proxy 를 순서대로 사용하고, 시도마다 예비 proxy 의 시작 순서를 바꾼다)
    - attempts(기본 3회) 모두 실패하면 FetchTimeoutError / FetchError 로 중단
    """
    import urllib.parse
    import requests

    proxies = proxies or CORS_PROXIES
    primary = PRIMARY_PROXIES if primary is None else primary
    http_get = http_get or http_get_sync

    def proxied_get(url, *args, **kwargs):
        url = limit_naver_count(url, _fetch_state["naver_count"])
        timed_out, errors = False, {}
        for attempt in range(1, attempts + 1):
            report_status(f"Data 를 가져오는 중... (시도 {attempt}/{attempts}, 제한 시간 {timeout}초)")
            deadline = time.monotonic() + timeout
            shift = (attempt - 1) % len(proxies)
            for proxy in primary + proxies[shift:] + proxies[:shift]:
                host = proxy.split("/")[2]
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    timed_out = True
                    break
                proxy_url = proxy.format(url=url, url_enc=urllib.parse.quote(url, safe=""))
                try:
                    r = http_get(proxy_url, remaining)
                except FetchTimeoutError:
                    timed_out = True
                    errors[host] = "Time Out"
                    break
                except Exception as e:
                    errors[host] = str(e)
                    continue
                if r.status_code == 200 and r.content:
                    return r
                errors[host] = f"HTTP {r.status_code}"

        if timed_out:
            raise FetchTimeoutError(
                f"{attempts}회 시도하였으나 Time Out({timeout}초)으로 Data 를 가져오지 못했습니다. "
                "'Check' 버튼을 누르면 다시 시도합니다.")
        detail = ", ".join(f"{h}: {m}" for h, m in errors.items())
        raise FetchError(
            f"{attempts}회 시도하였으나 Data 를 가져오지 못했습니다 ({detail}). "
            "'Check' 버튼을 누르면 다시 시도합니다.")

    requests.get = proxied_get


def get_currency(code):
    """종목 코드로 가격 단위를 정한다. 한국(KRX 6자리 코드) 주식은 '원', 그 외(미국 등)는 '달러'."""
    return "원" if re.fullmatch(r"\d{4}[0-9A-Z]{2}", code) else "달러"


def fetch_stock_data(code, start, end):
    """
    finance-datareader 로 종목 코드의 일별 주가 Data 를 가져온다.
    code: '005930', 'BITX' 등 / start, end: 'YYYY-MM-DD'
    """
    import FinanceDataReader as fdr

    df = fdr.DataReader(code, start, end)
    if df is None or df.empty:
        raise ValueError(f"'{code}' 종목의 {start} ~ {end} 기간 Data 가 없습니다.")
    return df


def get_daily_close(df):
    """주가 DataFrame 에서 날짜별 종가(Close) Series 를 반환한다."""
    close = df["Close"].dropna()
    close.index = pd.to_datetime(close.index)
    return close.sort_index()


def get_fetch_start(start, window):
    """
    모멘텀 / RSI 를 조회 시작일부터 계산할 수 있도록, window 거래일만큼 앞선 날짜부터 Data 를 가져온다.
    (거래일 1일 ≈ 달력일 1.5일 + 휴장 여유 15일)
    """
    start = pd.Timestamp(start) - pd.Timedelta(days=int(window * 1.5) + 15)
    return start.strftime("%Y-%m-%d")


def calc_k_ratio(close, window=20):
    """
    k-ratio 모멘텀을 계산한다.
    최근 window 거래일의 log(종가)를 시간(0..window-1)에 대해 선형회귀한 뒤
        k-ratio = 기울기 / 기울기의 표준오차
    즉 window 일 수익률 추세의 기울기가 얼마나 크고(수익률) 일정한지(안정성)를 함께 나타낸다.
    양수면 상승 추세, 음수면 하락 추세이며 절대값이 클수록 추세가 뚜렷하다.
    """
    window = int(window)
    if window < 3:
        raise ValueError("모멘텀 기간은 3일 이상이어야 합니다.")

    x = np.arange(window, dtype=float)
    x_c = x - x.mean()
    sxx = (x_c ** 2).sum()

    def k_ratio(y):
        slope = (x_c * (y - y.mean())).sum() / sxx
        resid = y - (y.mean() + slope * x_c)
        se = np.sqrt((resid ** 2).sum() / (window - 2) / sxx)
        return slope / se if se > 0 else np.nan

    return np.log(close).rolling(window).apply(k_ratio, raw=True)


def calc_rsi(close, period=14):
    """
    RSI (Relative Strength Index) 를 계산한다.
        RS_avg_inc = 과거 period 일간 상승폭의 평균 (하락한 날은 상승폭 0)
        RS_avg_dec = 과거 period 일간 하락폭의 평균 (상승한 날은 하락폭 0)
        RS  = RS_avg_inc / RS_avg_dec
        RSI = 100 - (100 / (1 + RS))
    하락이 전혀 없으면 100, 상승·하락 모두 없으면 계산하지 않는다(NaN).
    """
    period = int(period)
    diff = close.diff()
    avg_inc = diff.clip(lower=0).rolling(period).mean()
    avg_dec = (-diff).clip(lower=0).rolling(period).mean()

    rs = avg_inc / avg_dec
    rsi = 100 - (100 / (1 + rs))
    rsi[(avg_dec == 0) & (avg_inc > 0)] = 100.0
    rsi[(avg_dec == 0) & (avg_inc == 0)] = np.nan
    return rsi


def calc_moving_average(close, window):
    """window 일 단순 이동 평균 (최근 window 거래일 종가의 평균)."""
    return close.rolling(int(window)).mean()


def _grid():
    return dict(showgrid=True, gridcolor="rgba(128,128,128,0.18)", gridwidth=1)


def _price_format(currency):
    return ",.0f" if currency == "원" else ",.2f"


def _dates(series):
    return [d.strftime("%Y-%m-%d") for d in series.index]


def _values(series):
    return [None if pd.isna(v) else float(v) for v in series.values]


def build_close_chart(close, title, currency="원"):
    """
    종가 Series 로 Plotly.js 용 그래프 spec(dict)을 만든다.
    X축: 날짜, Y축: 종가(원/달러), grid 는 연하게 표시.
    """
    return {
        "data": [{
            "type": "scatter",
            "mode": "lines",
            "name": "종가",
            "x": _dates(close),
            "y": _values(close),
            "line": {"color": "#2563eb", "width": 2},
            "hovertemplate": f"종가: %{{y:{_price_format(currency)}}} {currency}<extra></extra>",
        }],
        "layout": {
            "title": {"text": title},
            "xaxis": {"title": {"text": "날짜"}, "type": "date", **_grid()},
            "yaxis": {"title": {"text": f"가격 ({currency})"}, "tickformat": ",", **_grid()},
            "margin": {"l": 80, "r": 30, "t": 60, "b": 60},
            "hovermode": "x unified",
            "showlegend": False,
        },
    }


def build_indicator_chart(close, indicator, title, name, color, currency="원",
                          hover_format=".2f", yaxis_extra=None, shapes=None):
    """
    보조지표(왼쪽 Y축, 실선)와 종가(오른쪽 Y축, 회색 점선으로 흐리게)를 함께 그리는 spec(dict).
    모멘텀, RSI 그래프가 공통으로 사용한다.
    """
    return {
        "data": [
            {
                "type": "scatter",
                "mode": "lines",
                "name": f"종가 ({currency})",
                "x": _dates(close),
                "y": _values(close),
                "yaxis": "y2",
                "line": {"color": "#6b7280", "width": 1.8, "dash": "dot"},
                "opacity": 0.85,
                "hovertemplate": f"종가: %{{y:{_price_format(currency)}}} {currency}<extra></extra>",
            },
            {
                "type": "scatter",
                "mode": "lines",
                "name": name,
                "x": _dates(indicator),
                "y": _values(indicator),
                "yaxis": "y",
                "line": {"color": color, "width": 2},
                "hovertemplate": f"{name}: %{{y:{hover_format}}}<extra></extra>",
            },
        ],
        "layout": {
            "title": {"text": title},
            "xaxis": {"title": {"text": "날짜"}, "type": "date", **_grid()},
            "yaxis": {"title": {"text": name}, "side": "left", **_grid(), **(yaxis_extra or {})},
            "yaxis2": {
                "title": {"text": f"가격 ({currency})"}, "side": "right", "overlaying": "y",
                "tickformat": ",", "showgrid": False,
            },
            "shapes": shapes or [],
            "margin": {"l": 80, "r": 90, "t": 60, "b": 60},
            "hovermode": "x unified",
            "legend": {"orientation": "h", "x": 0, "y": 1.02, "yanchor": "bottom"},
        },
    }


def build_momentum_chart(close, momentum, title, window, currency="원"):
    """k-ratio 모멘텀(왼쪽 Y축) + 종가(오른쪽 Y축) 그래프 spec(dict). 0 기준선 표시."""
    return build_indicator_chart(
        close, momentum, title, f"모멘텀 (k-ratio, {window}일)", "#e8590c", currency,
        yaxis_extra={"zeroline": True, "zerolinecolor": "rgba(128,128,128,0.55)"},
    )


def build_rsi_chart(close, rsi, title, period=14, currency="원"):
    """
    RSI(왼쪽 Y축, 0~100) + 종가(오른쪽 Y축) 그래프 spec(dict).
    과매수(70) / 과매도(30) 기준선을 연하게 표시하고, 각 선 위에 이름을 적는다.
    """
    def hline(y, color):
        return {"type": "line", "xref": "paper", "x0": 0, "x1": 1, "yref": "y", "y0": y, "y1": y,
                "line": {"color": color, "width": 1, "dash": "dash"}}

    def hline_label(y, text, color):
        return {"xref": "paper", "x": 0.005, "xanchor": "left", "yref": "y", "y": y, "yanchor": "bottom",
                "text": text, "showarrow": False, "font": {"color": color, "size": 12},
                "bgcolor": "rgba(255,255,255,0.7)"}

    overbought, oversold = "rgba(214,39,40,0.85)", "rgba(31,99,198,0.85)"
    chart = build_indicator_chart(
        close, rsi, title, f"RSI ({period}일)", "#7c3aed", currency, hover_format=".1f",
        yaxis_extra={"range": [0, 100], "dtick": 10},
        shapes=[hline(70, overbought), hline(30, oversold)],
    )
    chart["layout"]["annotations"] = [
        hline_label(70, "과매수 Line (70)", overbought),
        hline_label(30, "과매도 Line (30)", oversold),
    ]
    return chart


def build_moving_average_chart(close, averages, title, currency="원"):
    """
    종가(회색 점선, 흐리게) + 이동 평균선(실선)들을 하나의 Y축(가격)에 그리는 spec(dict).
    averages: [(이름, Series, 색), ...]
    """
    fmt = _price_format(currency)
    data = [{
        "type": "scatter",
        "mode": "lines",
        "name": f"종가 ({currency})",
        "x": _dates(close),
        "y": _values(close),
        "line": {"color": "#6b7280", "width": 1.8, "dash": "dot"},
        "opacity": 0.85,
        "hovertemplate": f"종가: %{{y:{fmt}}} {currency}<extra></extra>",
    }]
    for name, series, color in averages:
        data.append({
            "type": "scatter",
            "mode": "lines",
            "name": name,
            "x": _dates(series),
            "y": _values(series),
            "line": {"color": color, "width": 2},
            "hovertemplate": f"{name}: %{{y:{fmt}}} {currency}<extra></extra>",
        })
    return {
        "data": data,
        "layout": {
            "title": {"text": title},
            "xaxis": {"title": {"text": "날짜"}, "type": "date", **_grid()},
            "yaxis": {"title": {"text": f"가격 ({currency})"}, "tickformat": ",", **_grid()},
            "margin": {"l": 80, "r": 30, "t": 60, "b": 60},
            "hovermode": "x unified",
            "legend": {"orientation": "h", "x": 0, "y": 1.02, "yanchor": "bottom"},
        },
    }


def summarize_close(close, momentum=None, currency="원", rsi=None):
    """결과 영역에 보여줄 간단한 요약 정보(dict)를 반환한다."""
    first, last = float(close.iloc[0]), float(close.iloc[-1])
    summary = {
        "start": close.index[0].strftime("%Y-%m-%d"),
        "end": close.index[-1].strftime("%Y-%m-%d"),
        "days": int(len(close)),
        "currency": currency,
        "first": first,
        "last": last,
        "change_pct": (last / first - 1) * 100 if first else 0.0,
        "high": float(close.max()),
        "low": float(close.min()),
        "momentum": None,
        "rsi": None,
    }
    if momentum is not None and momentum.notna().any():
        summary["momentum"] = float(momentum.dropna().iloc[-1])
    if rsi is not None and rsi.notna().any():
        summary["rsi"] = float(rsi.dropna().iloc[-1])
    return summary


def run_check(code, label, start, end, window=20, rsi_period=14):
    """
    'Check' 버튼 실행:
    Data 조회 -> 종가 추출 -> k-ratio 모멘텀 / RSI / 이동 평균 계산 -> 그래프 spec 4개 + 요약 을 JSON 으로 반환.
    """
    window, rsi_period = int(window), int(rsi_period)
    currency = get_currency(code)
    fetch_start = get_fetch_start(start, max(window, rsi_period + 1, 20))
    _fetch_state["naver_count"] = get_naver_count(fetch_start)
    df = fetch_stock_data(code, fetch_start, end)
    close_all = get_daily_close(df)
    momentum_all = calc_k_ratio(close_all, window)
    rsi_all = calc_rsi(close_all, rsi_period)
    ma5_all = calc_moving_average(close_all, 5)
    ma20_all = calc_moving_average(close_all, 20)

    # 지표 계산용으로 앞당겨 가져온 Data 는 잘라내고 사용자가 선택한 기간만 표시
    close = close_all.loc[start:end]
    momentum = momentum_all.loc[start:end]
    rsi = rsi_all.loc[start:end]
    ma5 = ma5_all.loc[start:end]
    ma20 = ma20_all.loc[start:end]
    if close.empty:
        raise ValueError(f"'{code}' 종목의 {start} ~ {end} 기간 Data 가 없습니다.")

    charts = [
        build_close_chart(close, f"{label} 일별 종가", currency),
        build_momentum_chart(close, momentum, f"{label} 모멘텀 (k-ratio, {window}일 기준)", window, currency),
        build_rsi_chart(close, rsi, f"{label} RSI ({rsi_period}일 기준)", rsi_period, currency),
        build_moving_average_chart(
            close, [("5일 이동 평균", ma5, "#e03131"), ("20일 이동 평균", ma20, "#1c7ed6")],
            f"{label} 이동 평균 (5일 / 20일)", currency),
    ]
    summary = summarize_close(close, momentum, currency, rsi)
    return json.dumps({"charts": charts, "summary": summary})


def safe_run_check(code, label, start, end, window=20, rsi_period=14):
    """run_check 를 실행하고, 오류가 나면 {"error": 메시지} JSON 을 반환한다. (Web Page 에서 호출)"""
    try:
        return run_check(code, label, start, end, window, rsi_period)
    except Exception as e:
        return json.dumps({"error": str(e) or type(e).__name__})

<!-- Python(Pyodide) 은 Web Worker 에서 실행: 화면이 멈추지 않고, Data 요청에 제한 시간(functions.FETCH_TIMEOUT_SEC)을 걸 수 있다 -->
<script type="text/plain" id="worker-js">
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.29.5/full/";
importScripts(PYODIDE_URL + "pyodide.js");
let pyodide = null;
let functions = null;

async function init(src) {
  pyodide = await loadPyodide({ indexURL: PYODIDE_URL });
  postMessage({ type: "status", msg: "패키지 설치 중... (pandas, finance-datareader)" });
  await pyodide.loadPackage(["micropip", "pandas", "requests", "ssl"]);
  await pyodide.pyimport("micropip").install(["finance-datareader"]);

  // functions.py 를 가상 파일시스템에 저장 후 모듈로 import
  pyodide.FS.writeFile("/home/pyodide/functions.py", src);
  functions = pyodide.pyimport("functions");
  functions.install_browser_requests();
  functions.set_status_callback((msg) => postMessage({ type: "status", msg }));

  // 설정 영역 초기값 (Python 함수 사용)
  const options = JSON.parse(pyodide.runPython("import json, functions; json.dumps(functions.get_stock_options())"));
  const period = JSON.parse(pyodide.runPython("json.dumps(functions.get_default_period())"));
  postMessage({ type: "ready", options, period });
}

onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    try { await init(m.src); }
    catch (err) { postMessage({ type: "init-error", msg: String(err.message || err).trim().split("\n").pop() }); }
  } else if (m.type === "check") {
    let json;
    try { json = functions.safe_run_check(m.code, m.label, m.start, m.end, m.window); }
    catch (err) { json = JSON.stringify({ error: String(err.message || err).trim().split("\n").pop() }); }
    postMessage({ type: "result", json });
  }
};
</script>

<script>
const $ = (id) => document.getElementById(id);
let onResult = null;  // 진행 중인 Check 의 결과를 받을 함수

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", isError);
}

const worker = new Worker(URL.createObjectURL(
  new Blob([$("worker-js").textContent], { type: "text/javascript" })));

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "status") {
    setStatus(m.msg);
  } else if (m.type === "ready") {
    const [start, end] = m.period;
    $("stock").innerHTML = m.options.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
    $("start").value = start;
    $("start").max = end;
    $("end").value = end;
    $("stock").disabled = $("start").disabled = $("window").disabled = $("check").disabled = false;
    setStatus("준비 완료. 종목과 시작 날짜를 선택하고 Check 를 누르세요.");
  } else if (m.type === "init-error") {
    setStatus(`초기화 실패: ${m.msg}`, true);
  } else if (m.type === "result" && onResult) {
    onResult(JSON.parse(m.json));
  }
};
worker.onerror = (e) => setStatus(`Python 실행 환경 오류: ${e.message || e}`, true);
worker.postMessage({ type: "init", src: $("functions-py").textContent });

function fmt(n, currency) {
  const digits = currency === "원" ? 0 : 2;
  const num = n.toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return currency ? `${num} ${currency}` : num;
}

function renderSummary(s) {
  const color = s.change_pct >= 0 ? "var(--up)" : "var(--down)";
  const sign = s.change_pct >= 0 ? "+" : "";
  const items = [
    ["기간", `${s.start} ~ ${s.end}`],
    ["거래일 수", `${s.days}일`],
    ["시작 종가", fmt(s.first, s.currency)],
    ["마지막 종가", fmt(s.last, s.currency)],
    ["기간 수익률", `<span style="color:${color}">${sign}${s.change_pct.toFixed(2)}%</span>`],
    ["최고 종가", fmt(s.high, s.currency)],
    ["최저 종가", fmt(s.low, s.currency)],
    ["최근 모멘텀 (k-ratio)", s.momentum === null ? "-" : s.momentum.toFixed(2)],
    ["최근 RSI (14일)", s.rsi === null ? "-" : s.rsi.toFixed(1)],
  ];
  $("summary").innerHTML = items
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function onCheck() {
  const sel = $("stock");
  const code = sel.value;
  const label = sel.options[sel.selectedIndex].text;
  const start = $("start").value;
  const end = $("end").value;
  const momentumWindow = Number($("window").value);
  if (!start || start > end) { setStatus("시작 날짜를 올바르게 선택하세요.", true); return; }
  if (!Number.isInteger(momentumWindow) || momentumWindow < 3 || momentumWindow > 250) {
    setStatus("모멘텀 기간은 3 ~ 250 사이의 정수(일)로 입력하세요.", true); return;
  }

  $("check").disabled = true;
  setStatus(`${label} Data 를 가져오는 중...`);
  onResult = (result) => {
    onResult = null;
    $("check").disabled = false;  // 실패해도 Check 를 다시 눌러 재시도 가능
    if (result.error) { setStatus(`오류: ${result.error}`, true); return; }
    // 결과 영역: [0] 일별 종가, [1] 모멘텀 + 종가, [2] RSI + 종가, [3] 이동 평균 + 종가 그래프
    $("charts").innerHTML = result.charts.map((_, i) => `<div class="chart" id="chart-${i}"></div>`).join("");
    result.charts.forEach((c, i) =>
      Plotly.newPlot(`chart-${i}`, c.data, c.layout, { responsive: true, displaylogo: false }));
    renderSummary(result.summary);
    setStatus(`완료: ${label} (${result.summary.days}일)`);
  };
  worker.postMessage({ type: "check", code, label, start, end, window: momentumWindow });
}

$("check").addEventListener("click", onCheck);
</script>
